<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawai Darpan · दवाई दर्पण</title>
<meta name="theme-color" content="#14324A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14324A;          /* deep pharmacy navy */
    --ink-soft: #4A6275;
    --foil: #E6ECEF;         /* blister-foil silver */
    --foil-line: #C9D3D9;
    --paper: #FBFCFD;
    --green: #127A55;        /* generic / savings */
    --green-tint: #E1F2EA;
    --marigold: #E59A12;     /* the one loud accent: money saved */
    --brick: #B0452E;        /* warnings */
    --brick-tint: #FBEAE5;
    --radius-strip: 22px;
    --radius-small: 10px;
    --font: "Mukta", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--foil);
    background-image: radial-gradient(circle at 1px 1px, rgba(20,50,74,.06) 1px, transparent 0);
    background-size: 14px 14px;     /* the dimpled foil texture of a medicine strip */
    font-size: 17px;
    line-height: 1.5;
    display: flex; flex-direction: column;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }

  /* ---------- Header ---------- */
  header {
    background: var(--ink); color: var(--paper);
    padding: max(12px, env(safe-area-inset-top)) 18px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .deva { font-family: "Yatra One", var(--font); font-size: 1.55rem; line-height: 1; }
  .brand .latin { font-weight: 600; opacity: .75; font-size: .95rem; }
  .lang-btn {
    background: transparent; border: 1.5px solid rgba(251,252,253,.45); color: var(--paper);
    border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 600;
  }

  /* ---------- Chat ---------- */
  main { flex: 1; overflow-y: auto; padding: 18px 14px 8px; }
  .feed { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: normal; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--foil-line); border-bottom-left-radius: 4px; }
  .msg.bot p { margin: 0 0 6px; }
  .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul { margin: 4px 0 6px; padding-left: 20px; }
  .msg.bot table { border-collapse: collapse; margin: 6px 0; font-size: .92rem; }
  .msg.bot td, .msg.bot th { border: 1px solid var(--foil-line); padding: 4px 8px; text-align: left; }
  .msg .meta { font-size: .8rem; opacity: .7; margin-bottom: 2px; }
  .msg img.preview { display: block; max-width: 180px; border-radius: 10px; margin-bottom: 6px; }
  .speak {
    margin-top: 6px; background: none; border: none; cursor: pointer; color: var(--green);
    font-weight: 600; padding: 2px 0; display: inline-flex; align-items: center; gap: 6px;
  }
  .warn { color: var(--brick); }

  /* ---------- The memorable thing: savings strip ---------- */
  .strip {
    align-self: stretch; background: var(--paper);
    border-radius: var(--radius-strip); border: 1px solid var(--foil-line);
    padding: 16px 16px 14px; position: relative; overflow: hidden;
  }
  .strip::before {               /* blister pockets along the top edge */
    content: ""; position: absolute; left: 16px; right: 16px; top: 6px; height: 6px;
    background: radial-gradient(circle, var(--foil-line) 3px, transparent 3.5px) 0 0 / 22px 6px repeat-x;
  }
  .strip h3 { margin: 6px 0 2px; font-size: 1.05rem; font-weight: 700; }
  .strip .generic { color: var(--green); font-weight: 700; font-size: 1.15rem; line-height: 1.3; }
  .bars { margin-top: 12px; display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 10px; font-size: .9rem; }
  .bar { height: 14px; border-radius: 7px; background: var(--foil); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 7px; transform-origin: left; animation: grow .7s ease-out both; }
  .bar.brand i { background: var(--ink-soft); }
  .bar.gen i { background: var(--green); }
  .price { font-weight: 700; white-space: nowrap; }
  .saved {
    margin-top: 12px; display: flex; align-items: baseline; gap: 8px;
    border-top: 1.5px dashed var(--foil-line); padding-top: 10px;
  }
  .saved b { font-size: 2.1rem; line-height: 1; color: var(--marigold); font-weight: 800; letter-spacing: -.5px; }
  .note { font-size: .82rem; color: var(--ink-soft); margin-top: 6px; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }


  /* ---------- Nearest Kendra ---------- */
  .near-btn { margin: 12px 0 0 8px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
              border: 1.5px solid var(--green); color: var(--green); background: var(--paper);
              border-radius: 999px; padding: 7px 14px; font-weight: 700; font-family: inherit; font-size: .9rem; }
  .near-btn:hover { background: var(--green-tint); }
  .kendras { align-self: flex-start; width: min(100%, 520px); background: var(--paper); border-radius: 20px;
             border: 1px solid var(--foil-line); padding: 16px 16px 12px; animation: rise .35s ease-out both;
             box-shadow: 0 14px 30px -22px rgba(10,30,45,.45); }
  .kendras h3 { margin: 0; font-size: 1.05rem; }
  .k-near { margin: 4px 0 0; font-size: .9rem; color: var(--ink-soft); }
  .k-near b { color: var(--ink); }
  .k-same { margin: 4px 0 10px; color: var(--green); font-weight: 600; font-size: .9rem; }
  .kendras ol { list-style: none; margin: 0; padding: 0; }
  .kendras li { display: grid; grid-template-columns: 78px 1fr auto; gap: 10px; align-items: center;
                padding: 10px 0; border-top: 1px dashed var(--foil-line); }
  .k-dist { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; font-size: .9rem; line-height: 1.2; }
  .k-body b { display: block; font-weight: 600; line-height: 1.3; font-size: .95rem; }
  .k-body small { color: var(--ink-soft); font-size: .8rem; }
  .k-route { white-space: nowrap; text-decoration: none; font-weight: 700; color: var(--paper); background: var(--green);
             border-radius: 999px; padding: 7px 12px; font-size: .85rem; }
  .k-route:hover { background: #0E6446; }
  .k-note { margin: 8px 0 0; font-size: .8rem; color: var(--ink-soft); }
  @media (max-width: 480px) {
    .kendras li { grid-template-columns: 1fr auto; }
    .k-dist { grid-column: 1 / -1; }
  }

  /* ---------- Confirm (agent asks a question) ---------- */
  .confirm { align-self: flex-start; max-width: 88%; background: var(--green-tint); border: 1px solid #B9DDCB;
             border-radius: 16px; padding: 12px 14px; }
  .confirm .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .confirm input { flex: 1; min-width: 140px; border: 1px solid var(--foil-line); border-radius: var(--radius-small);
                   padding: 8px 10px; background: var(--paper); }
  .btn { border: none; border-radius: var(--radius-small); padding: 9px 16px; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--green); color: var(--paper); }
  .btn.ghost { background: var(--paper); border: 1px solid var(--foil-line); }

  /* Typing: teen goliyan ek ke baad ek uchhalti hain */
  .typing { align-self: flex-start; display: flex; align-items: center; gap: 10px; color: var(--ink-soft);
            padding: 6px 8px; font-size: .95rem; }
  .pills { display: flex; gap: 5px; }
  .pills i { width: 16px; height: 8px; border-radius: 4px; background: var(--green); opacity: .35;
             animation: hop 1s infinite ease-in-out; }
  .pills i:nth-child(2) { animation-delay: .15s; } .pills i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 40% { transform: translateY(-5px); opacity: 1; } }

  /* Shuru ke sujhaav (ek tap mein sawaal) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 100%; }
  .chip { background: var(--paper); border: 1.5px solid var(--foil-line); border-radius: 999px;
          padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--ink); }
  .chip:hover { border-color: var(--green); color: var(--green); }

  /* Bot ka chhota darpan-chinh */
  .bot-row { display: flex; gap: 8px; align-items: flex-end; align-self: flex-start; max-width: 92%; }
  .bot-row .msg { max-width: 100%; }
  .avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--ink);
            display: grid; place-items: center; }
  .avatar svg { width: 18px; height: 18px; }

  /* Card ke neeche: WhatsApp pe bhejo */
  .share { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer;
           background: #1FA855; color: #fff; font-weight: 700; border-radius: 999px; padding: 8px 16px; }
  .share svg { width: 18px; height: 18px; fill: #fff; }

  /* Mic sun raha hai: awaaz ke saath hilne wali patti */
  .level { height: 6px; border-radius: 3px; background: var(--brick-tint); overflow: hidden; margin-top: 4px; }
  .level i { display: block; height: 100%; width: 0; background: var(--brick); border-radius: 3px; transition: width .08s; }

  /* Tiranga ki patli lakeer: sarkari Jan Aushadhi yojana ka ishaara, bas itna */
  .tricolour { height: 3px; background: linear-gradient(90deg, #FF9933 0 33.3%, #FBFCFD 33.3% 66.6%, #138808 66.6%); }

  /* Picker ka darpan */
  .mirror-art { width: 210px; max-width: 60vw; margin-bottom: 18px; }

  /* ---------- Composer ---------- */
  footer {
    background: var(--paper); border-top: 1px solid var(--foil-line);
    padding: 10px 12px max(10px, env(safe-area-inset-bottom));
  }
  .composer { max-width: 640px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; }
  .icon-btn {
    width: 46px; height: 46px; flex: none; border-radius: 50%; border: 1.5px solid var(--foil-line);
    background: var(--paper); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); }
  textarea {
    flex: 1; resize: none; max-height: 120px; min-height: 46px; border: 1.5px solid var(--foil-line);
    border-radius: 23px; padding: 10px 16px; background: var(--paper); outline: none;
  }
  textarea:focus { border-color: var(--ink-soft); }
  .mic {
    width: 58px; height: 58px; flex: none; border-radius: 50%; border: none; cursor: pointer;
    background: var(--green); display: grid; place-items: center; box-shadow: 0 3px 0 #0C5A3E;
  }
  .mic svg { width: 26px; height: 26px; stroke: var(--paper); }
  .mic.recording { background: var(--brick); box-shadow: 0 3px 0 #7E2F1E; animation: pulse 1.2s infinite; }
  .mic.send svg { stroke: var(--paper); }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .attach-preview { max-width: 640px; margin: 0 auto 8px; display: none; align-items: center; gap: 10px; font-size: .9rem; }
  .attach-preview img { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; }
  .attach-preview button { background: none; border: none; color: var(--brick); cursor: pointer; font-weight: 700; }
  .rec-time { max-width: 640px; margin: 0 auto 8px; color: var(--brick); font-weight: 700; display: none; }
  .disclaimer { text-align: center; font-size: .75rem; color: var(--ink-soft); margin: 6px auto 0; max-width: 640px; }

  /* ---------- Language picker ---------- */
  .picker button.current { outline: 3px solid var(--marigold, #E59A12); outline-offset: 2px; }
  .picker {
    position: fixed; inset: 0; background: var(--ink); color: var(--paper); z-index: 10;
    display: flex; flex-direction: column; justify-content: center; padding: 28px 22px;
  }
  .picker .deva { font-family: "Yatra One", var(--font); font-size: 2.6rem; line-height: 1.1; }
  .picker p { opacity: .8; margin: 6px 0 26px; }
  .picker .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 420px; }
  .picker button {
    background: var(--paper); color: var(--ink); border: none; border-radius: 14px;
    padding: 18px 12px; font-size: 1.25rem; font-weight: 700; cursor: pointer; text-align: left;
  }
  .picker button small { display: block; font-size: .8rem; font-weight: 500; color: var(--ink-soft); }
  .hidden { display: none !important; }

  /* ===== Dynamic UI ===== */
  /* 1. Darpan intro: strip utarti hai → sone ki lakeer khinchti hai → hari parchhai ubharti hai */
  .m-top { animation: drop .6s cubic-bezier(.2,.8,.2,1) both; }
  .m-line { transform-origin: 110px 76px; animation: sweep .5s .45s ease-out both; }
  .m-reflect { animation: reflect .7s .8s ease-out both; }
  .picker .deva, .picker p, .picker .choices { animation: rise .5s ease-out both; }
  .picker .deva { animation-delay: 1s; } .picker p { animation-delay: 1.1s; } .picker .choices { animation-delay: 1.2s; }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
  @keyframes sweep { from { transform: scaleX(0); } }
  @keyframes reflect { from { transform: translateY(-16px); opacity: 0; } to { opacity: .55; } }

  /* 2. Har naya message neeche se halka sa upar aata hai */
  .bot-row, .msg.user, .strip, .confirm, .chips { animation: rise .35s ease-out both; }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } }
  /* Jawab ki lines ek-ek karke */
  .msg.bot > p, .msg.bot li, .msg.bot tr { animation: rise .3s ease-out both; }
  .chips .chip { animation: rise .3s ease-out both; }

  /* 3. Photo padhte waqt: photo pe scan wali lakeer */
  .scan-wrap { position: relative; display: inline-block; border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
  .scan-wrap img.preview { margin: 0; }
  .scan-wrap.scanning::after {
    content: ""; position: absolute; left: 0; right: 0; height: 30%;
    background: linear-gradient(180deg, transparent, rgba(229,154,18,.55), transparent);
    animation: scan 1.3s ease-in-out infinite;
  }
  @keyframes scan { from { top: -30%; } to { top: 100%; } }

  /* 4. Mic: awaaz ke saath bada hone wala chhalla */
  .mic { position: relative; }
  .mic.recording::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--brick);
    opacity: .5; transform: scale(calc(1 + var(--lvl, 0) * .45)); transition: transform .08s;
  }

  /* 5. Bolte waqt: Suno button pe equalizer */
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; background: var(--green); border-radius: 2px; animation: eq .8s infinite ease-in-out; }
  .eq i:nth-child(1) { height: 6px; } .eq i:nth-child(2) { height: 12px; animation-delay: .2s; }
  .eq i:nth-child(3) { height: 8px; animation-delay: .4s; } .eq i:nth-child(4) { height: 11px; animation-delay: .1s; }
  @keyframes eq { 50% { transform: scaleY(.35); } }

  /* 6. Bachat ka number: ginti ke baad halka sa "thappa" */
  .saved b.pop { animation: pop .35s ease-out; }
  @keyframes pop { 50% { transform: scale(1.18); } }

  /* ===== More dynamics ===== */
  /* A. Foil ki chamak: poore background pe dheere se roshni guzarti hai (jaise strip ghumao toh) */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%) no-repeat;
    background-size: 250% 100%; animation: sheen 9s ease-in-out infinite;
  }
  header, main, footer, .tricolour { position: relative; z-index: 1; }
  @keyframes sheen { 0%, 60% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

  /* B. Header ke naam pe darpan ki chamak */
  .brand .deva {
    background: linear-gradient(100deg, #FBFCFD 40%, #FFE2A8 50%, #FBFCFD 60%) 0 0 / 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: .28em .05em .12em; margin: -.28em 0 -.12em;     /* matra aur reph (र्) kate nahi */
    line-height: 1.25;
    animation: glint 7s ease-in-out infinite;
  }
  @keyframes glint { 0%, 70% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  /* C. Card "palat" ke aata hai (darpan mein dikhna), aur blister ki goliyan ek-ek karke hari hoti hain */
  .feed { perspective: 900px; }
  .strip { animation: flipIn .6s cubic-bezier(.2,.8,.2,1) both; transform-origin: top center; }
  @keyframes flipIn { from { transform: rotateX(-75deg); opacity: 0; } }
  .strip::before { display: none; }
  .blister { position: absolute; left: 16px; right: 16px; top: 6px; display: flex; justify-content: space-between; }
  .blister i { width: 6px; height: 6px; border-radius: 50%; background: var(--foil-line); transition: background .25s; }
  .blister i.on { background: var(--green); }

  /* D. Bachat ke ₹ sikke upar udte hain */
  .saved { position: relative; }
  .coin {
    position: absolute; left: 18px; bottom: 18px; width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFD77A, var(--marigold)); color: #7A4E00;
    font-size: 12px; font-weight: 800; display: grid; place-items: center; pointer-events: none;
    animation: coin 1.1s ease-out forwards;
  }
  @keyframes coin {
    0% { transform: translate(0, 0) scale(.4); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(var(--dx), -70px) scale(1); opacity: 0; }
  }

  /* E. Har button dabane pe halka sa "dab" (touch feedback) */
  button:active:not(:disabled) { transform: scale(.95); }
  .chip { transition: transform .15s, border-color .15s, color .15s; }
  .chip:hover { transform: translateY(-2px); }

  /* F. Pehli baar mic "saans" leta hai: yahan dabao */
  .mic.invite { animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 3px 0 #0C5A3E, 0 0 0 10px rgba(18,122,85,.18); } }

  /* ===== Showcase: badi screen pe khaali jagah mein "live darpan" ===== */
  .showcase { display: none; }
  .sc-card { background: var(--paper); border-radius: 26px; padding: 26px 26px 22px; position: relative;
             box-shadow: 0 30px 60px -30px rgba(10, 30, 45, .45); overflow: hidden; }
  .sc-eyebrow { font-size: .85rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 14px; }
  .sc-strip { border-radius: 18px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
              gap: 12px; position: relative; }
  .sc-strip .nm { font-weight: 700; line-height: 1.25; }
  .sc-strip .pr { font-weight: 800; font-size: 1.35rem; white-space: nowrap; }
  .sc-strip small { display: block; font-weight: 500; font-size: .78rem; opacity: .75; }
  .sc-brand { background: var(--foil); color: var(--ink); }
  .sc-generic { background: var(--green); color: var(--paper); }
  .sc-dots { position: absolute; left: 18px; right: 18px; top: 5px; display: flex; justify-content: space-between; }
  .sc-dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .25; }
  .sc-line { height: 3px; border-radius: 2px; background: var(--marigold); margin: 12px 4px; transform-origin: center;
             position: relative; overflow: hidden; }
  .sc-line::after { content: ""; position: absolute; inset: 0; width: 40%;
                    background: linear-gradient(90deg, transparent, #fff, transparent); animation: lineShine 2.4s infinite; }
  @keyframes lineShine { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
  .sc-save { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; position: relative; }
  .sc-save b { font-size: 3.4rem; line-height: 1; color: var(--marigold); font-weight: 800; letter-spacing: -1px; }
  .sc-save span { color: var(--ink-soft); font-weight: 600; }
  .sc-progress { display: flex; gap: 6px; margin-top: 16px; }
  .sc-progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--foil); overflow: hidden; position: relative; }
  .sc-progress i.done { background: var(--green); }
  .sc-progress i.active::after { content: ""; position: absolute; inset: 0; background: var(--green);
                                 transform-origin: left; animation: fill var(--slide-ms, 4200ms) linear both; }
  @keyframes fill { from { transform: scaleX(0); } }
  .sc-note { font-size: .74rem; color: var(--ink-soft); margin-top: 10px; }
  .sc-steps { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .sc-steps span { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
                   padding: 6px 14px; font-weight: 600; font-size: .9rem; }
  .showcase.side .sc-steps span { background: var(--paper); border-color: var(--foil-line); color: var(--ink); }
  /* Har nayi misaal: brand upar se, darpan ki lakeer, generic neeche se ubharta hai */
  .sc-enter .sc-brand { animation: drop .55s cubic-bezier(.2,.8,.2,1) both; }
  .sc-enter .sc-line { animation: sweep .45s .35s ease-out both; }
  .sc-enter .sc-generic { animation: rise .55s .6s cubic-bezier(.2,.8,.2,1) both; }
  .sc-enter .sc-save { animation: rise .45s .85s ease-out both; }


  /* ===== Chat page: the bill printer (brand price struck out, generic printed, "saved" stamp) ===== */
  .receipt-side::before { content: ""; position: absolute; inset: 10% -10% 0; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side, rgba(229,154,18,.16), transparent 70%); }

// ---------- Text ko safe HTML banao (thoda markdown: **bold**, - list, | table |) ----------
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function renderText(raw) {
  const lines = escapeHtml(raw).split("\n");
  let html = "", list = false, table = false;
  for (let line of lines) {
    const l = line.trim();
    if (/^\|.*\|$/.test(l)) {                                   // table row
      if (/^\|[\s:|-]+\|$/.test(l)) continue;                    // |---|---| separator
      if (!table) { html += "<table>"; table = true; }
      html += "<tr>" + l.slice(1, -1).split("|").map((c) => `<td>${c.trim()}</td>`).join("") + "</tr>";
      continue;
    } else if (table) { html += "</table>"; table = false; }
    if (/^[-•*]\s+/.test(l)) {
      if (!list) { html += "<ul>"; list = true; }
      html += `<li>${l.replace(/^[-•*]\s+/, "")}</li>`;
      continue;
    } else if (list) { html += "</ul>"; list = false; }
    if (l) html += `<p class="${l.startsWith("⚠️") ? "warn" : ""}">${l}</p>`;
  }
  if (list) html += "</ul>";
  if (table) html += "</table>";
  return html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*?)\*/g, "$1<i>$2</i>");
}

function scrollDown() { requestAnimationFrame(() => scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" })); }

// ---------- Bachat strip: tool ke asli numbers se (AI ke likhe text se nahi) ----------
function addCard(card) {

              <div class="generic">${escapeHtml(card.generic_name)}</div>`;

           <button class="near-btn" type="button">${t("near")}</button></div>`;
  div.insertAdjacentHTML("beforeend", html);
  div.querySelector(".near-btn").addEventListener("click", findNearbyKendras);
  div.querySelectorAll(".blister i").forEach((dot, i) => setTimeout(() => dot.classList.add("on"), 500 + i * 60));
  div.querySelector(".share").addEventListener("click", () => {
    const lines = [`💊 ${label}`, `✅ ${t("shareMsg")}: ${card.generic_name}`];
    if (genP) lines.push(`💰 Generic: ₹${genP} ${t("perPill")}` + (brandP ? ` (${t("brand")}: ₹${brandP})` : ""));
    if (card.saving_percent) lines.push(`📉 ${card.saving_percent}% ${t("saving")}`);
    lines.push(`⚕️ ${t("disclaimer")}`);
    const msg = lines.join("\n");
    if (navigator.share) navigator.share({ text: msg }).catch(() => {});
    else window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank", "noopener");
  });
  feed.appendChild(div); scrollDown();
  const big = div.querySelector(".saved b");
  if (big) countUp(big, Number(big.dataset.to));
}

// Bachat 0% se asli number tak ginti (bars ke saath-saath)
function countUp(el, to) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to + "%"; return; }
  const start = performance.now(), dur = 900;
  const step = (now) => {
    const p = Math.min(1, (now - start) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))) + "%";
    if (p < 1) requestAnimationFrame(step); else { el.classList.add("pop"); coins(el.closest(".saved")); }
  };
  requestAnimationFrame(step);
}

// Bachat dikhte hi kuch ₹ sikke udte hain
function coins(box) {
  if (!box || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 5; i++) {
    const c = document.createElement("span");
    c.className = "coin"; c.textContent = "₹";
    c.style.setProperty("--dx", `${(i - 2) * 22 + Math.random() * 10}px`);
    c.style.animationDelay = `${i * 90}ms`;
    box.appendChild(c);
    setTimeout(() => c.remove(), 1600 + i * 90);
  }
}

// ---------- Server se baat ----------
async function callApi(path, fields, files = {}) {
  busy = true; updateMainButton();
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = `<span class="pills" aria-hidden="true"><i></i><i></i><i></i></span><span>${t("thinking")}</span>`;
  feed.appendChild(typing); scrollDown();
  const wakeTimer = setTimeout(() => (typing.lastChild.textContent = t("wake")), 6000);   // free server so jaata hai

  const form = new FormData();
  Object.entries(fields).forEach(([k, v]) => form.append(k, v));
  Object.entries(files).forEach(([k, f]) => f && form.append(k, f.blob || f, f.name || "upload"));
  try {
    const res = await fetch(API + path, { method: "POST", body: form });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    typing.remove();
    if (data.transcript) addUser(`🎙️ ${data.transcript}`);
    if (data.status === "needs_input") {
      addConfirm(data.question);
    } else {
      const cards = data.cards || [];
      cards.forEach(addCard);
      addBot(data.answer || "", { autoSpeak: usedVoice, hasCard: cards.length > 0 });
      if (data.kendras && (data.kendras.list || []).length) addKendraCard(data.kendras.list, data.kendras.near);
      if ((data.suggestions || []).length) addSuggestionChips(data.suggestions);
    }
  } catch (e) {
    typing.remove();
    addBot(t("error"), { speakable: false });
  } finally {
    document.querySelectorAll(".scanning").forEach((el) => el.classList.remove("scanning"));   // padh liya
    clearTimeout(wakeTimer);
    busy = false; usedVoice = false; updateMainButton();
  }
}

  addUser(value, photoFile ? URL.createObjectURL(photoFile) : null);
  callApi("/chat", { thread_id: threadId, language: lang, message: value }, { photo: photoFile });
  text.value = ""; autoGrow(); clearPhoto();
}

// ---------- Mic (MediaRecorder) ----------
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach((tr) => tr.stop());
      if (recDiscard) { recDiscard = false; return; }         // cancelled (user left the chat): don't send
      const type = recorder.mimeType || "audio/webm";
      const ext = type.includes("mp4") ? ".m4a" : type.includes("ogg") ? ".ogg" : ".webm";
      const blob = new Blob(chunks, { type });
      if (blob.size < 2000) return;                         // kuch bola hi nahi
      usedVoice = true;
      callApi("/chat", { thread_id: threadId, language: lang }, { audio: { blob, name: "voice" + ext } });
    };
    recorder.start();
    recStart = Date.now();
    $("recTime").style.display = "block";
    // Awaaz kitni tez aa rahi hai: patti hile toh user ko pata chale ki mic sun raha hai
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      const buf = new Uint8Array(analyser.fftSize);
      const draw = () => {
        if (!audioCtx) return;
        analyser.getByteTimeDomainData(buf);
        let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
        $("levelBar").style.width = Math.min(100, peak * 1.6) + "%";
        mainBtn.style.setProperty("--lvl", Math.min(1, peak / 60));
        requestAnimationFrame(draw);
      };
      draw();
    } catch {}
    recTimer = setInterval(() => ($("recLabel").textContent = `${t("listening")}  ${Math.round((Date.now() - recStart) / 1000)}s`), 250);
    mainBtn.classList.add("recording");
  } catch {
    addBot("🎙️ Mic permission nahi mili. Browser settings mein mic allow karein.", { speakable: false });
  }
}
function stopRecording() {
  clearInterval(recTimer); $("recTime").style.display = "none";
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  mainBtn.classList.remove("recording");
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

// ---------- Awaaz mein suno ----------
let currentAudio = null, speakToken = 0;
function stopSpeaking() {
  speakToken++;                                                 // a voice still downloading won't start later
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  resetSpeakButtons();
}
function resetSpeakButtons() {
  document.querySelectorAll(".speak").forEach((b) => { if (b.dataset.label) { b.innerHTML = b.dataset.label; delete b.dataset.label; } });
}
async function speak(answer, button) {
  const wasPlaying = !!button.dataset.label;
  stopSpeaking();
  if (wasPlaying) return;                                       // dobara dabaya = band karo
  const myToken = speakToken;
  button.dataset.label = button.innerHTML;
  button.innerHTML = `<span class="pills" aria-hidden="true"><i></i><i></i><i></i></span>`;
  const playing = () => (button.innerHTML = `<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span> ■`);
  try {
    const form = new FormData(); form.append("text", answer); form.append("language", lang);
    const res = await fetch(API + "/tts", { method: "POST", body: form });
    const audioBlob = res.status === 200 ? await res.blob() : null;
    if (myToken !== speakToken) return;                         // user left the chat or pressed stop meanwhile
    if (audioBlob) {
      currentAudio = new Audio(URL.createObjectURL(audioBlob));
      currentAudio.onended = resetSpeakButtons;
      await currentAudio.play();
      playing();
    } else if ("speechSynthesis" in window) {                // server ki awaaz nahi chali: browser ki awaaz
      const u = new SpeechSynthesisUtterance(answer.replace(/[*#|]/g, " "));
      u.lang = { Hinglish: "en-IN", Hindi: "hi-IN", English: "en-IN", Marathi: "mr-IN" }[lang];
      u.onend = resetSpeakButtons;
      speechSynthesis.speak(u);
      playing();
    } else { resetSpeakButtons(); }
  } catch { resetSpeakButtons(); }
}

const EXAMPLES = [
  { brand: "Telma 40", generic: "Telmisartan 40 mg", b: 8.20, g: 1.24, s: 85 },

const SLIDE_MS = 4200;
const SC_TEXT = {
  Hinglish: { eyebrow: "Darpan mein dekho: brand ka saasta roop", per: "per goli", saved: "bachat", steps: ["📷 Photo", "🎙️ Bolo", "⌨️ Likho"] },

let slide = 0;
function capsulesHtml() {
  const colors = ["#E59A12", "#127A55", "#E05A47", "#3B82C4", "#127A55", "#E59A12", "#8E6BD1", "#127A55"];
  return colors.map((c, i) => {
    const left = 6 + i * 12 + (i % 2) * 4;
    const scale = [1, .7, .85, .6, 1.1, .75, .9, .65][i];
    return `<span class="cap" style="left:${left}%; --c1:${c}; --dur:${9 + (i % 4) * 2.5}s; --delay:-${i * 1.7}s;
             --r0:${i * 47}deg; scale:${scale}; opacity:${.35 + scale * .45}"></span>`;
  }).join("");
}
function pockets() { return `<div class="pockets">${"<span class='pocket'><i></i></span>".repeat(10)}</div>`; }

let stageBuilt = false;
function renderShowcases() {
  const ex = EXAMPLES[slide % EXAMPLES.length];

  document.querySelectorAll("[data-showcase]").forEach((box) => {

      box.innerHTML = `

      const k = slide % EXAMPLES.length;

function startShowcase() {
  if (!matchMedia("(min-width: 1000px)").matches) return;    // phone pe jagah nahi: chhod do
  renderShowcases();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  setInterval(() => { slide++; renderShowcases(); }, SLIDE_MS);
}



// ---------- Nearest Jan Aushadhi Kendra: browser location, or pincode if location is off ----------
// Location goes to our server rounded to ~100 m, only for this search, and is never stored.
function addWaiting(label) {
  const w = document.createElement("div");
  w.className = "typing";
  w.innerHTML = `<span class="pills" aria-hidden="true"><i></i><i></i><i></i></span><span>${label}</span>`;
  feed.appendChild(w); scrollDown();
  return w;
}
function findNearbyKendras() {
  const wait = addWaiting(t("locating"));
  const fallback = () => { wait.remove(); askPincode(t("askPin")); };
  if (!navigator.geolocation || !window.isSecureContext) return fallback();
  navigator.geolocation.getCurrentPosition(
    (pos) => loadKendras(`lat=${pos.coords.latitude.toFixed(3)}&lon=${pos.coords.longitude.toFixed(3)}`, wait),
    fallback,
    { timeout: 10000, maximumAge: 10 * 60 * 1000 });
}
async function loadKendras(query, wait) {
  try {
    const res = await fetch(API + "/kendras?" + query);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    wait.remove();
    if (data.found) addKendraCard(data.kendras, data.searched_near || (query.startsWith("lat=") ? t("myLoc") : ""));
    else askPincode(t("noKendra"));
  } catch (e) {
    wait.remove();
    addBot(t("error"), { speakable: false });
  }
}
function askPincode(message) {
  const form = document.createElement("form");
  form.className = "confirm";
  form.innerHTML = `<div class="pin-msg"></div>
    <div class="row"><input autocomplete="postal-code" maxlength="120" placeholder="411001 / Kalyani Nagar, Pune" aria-label="Pincode">
    <button class="btn primary" type="submit">${t("find")}</button></div>`;
  form.querySelector(".pin-msg").textContent = message;
  const input = form.querySelector("input");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const place = input.value.trim();
    const digits = place.replace(/\D/g, "");
    const looksLikePin = /^\d+$/.test(place.replace(/\s/g, ""));
    if ((looksLikePin && digits.length !== 6) || place.length < 3) {
      form.querySelector(".pin-msg").textContent = t("badPin"); input.focus(); return;
    }
    form.remove();
    addUser("📍 " + place);
    loadKendras("place=" + encodeURIComponent(place), addWaiting(t("thinking")));
  });
  feed.appendChild(form); scrollDown();
  input.focus();
}
function addKendraCard(kendras, near) {
  const card = document.createElement("div");
  card.className = "kendras";
  const items = kendras.map((k) => {
    const dist = k.distance_km < 1 ? t("under1") : `~${k.distance_km} km`;
    const place = [k.district, k.pincode].filter(Boolean).map(escapeHtml).join(" · ");
    return `<li>
      <span class="k-dist">${escapeHtml(dist)}</span>
      <div class="k-body"><b>${escapeHtml(k.address)}</b><small>${place}</small></div>
      <a class="k-route" href="${escapeHtml(k.directions_url)}" target="_blank" rel="noopener">${t("route")}</a>
    </li>`;
  }).join("");
  const nearLine = near ? `<p class="k-near">${t("nearLabel")} <b>${escapeHtml(near)}</b></p>` : "";
  card.innerHTML = `<h3>${t("nearTitle")}</h3>${nearLine}<p class="k-same">${t("samePrice")}</p>
    <ol>${items}</ol><p class="k-note">${t("stock")}</p>`;
  feed.appendChild(card); scrollDown();
}

const RC_TEXT = {
  Hinglish: { eyebrow: "Wahi dawai, chhota bill", title: "30 goli ka bill", brand: "Brand", generic: "Jan Aushadhi generic",
              save: "Aapki bachat", stamp: "BACHAT", locale: "en-IN" },

             save: "तुमची बचत", stamp: "बचत", locale: "mr-IN" },
};
const RC_CYCLE = 7000;
let rcSlide = 0, rcTimers = [];
const rupees = (n) => "₹" + n.toFixed(2);
function stopReceipt() { rcTimers.forEach(clearTimeout); rcTimers = []; }
function buildReceipt(box) {
  box.innerHTML = `
    <div class="rc-eyebrow"></div>
    <div class="printer"><span class="printer-name">दवाई दर्पण</span><span class="led"></span><span class="slot"></span></div>
    <div class="paper-wrap"><div class="paper">
      <div class="rc-head"><span class="rc-title"></span><span class="rc-date"></span></div>
      <div class="rc-rule"></div>
      <div class="rc-row brand"><span class="rc-name"><b class="bn"></b><small class="bt"></small></span>
        <span class="rc-amt"><span class="bp"></span><i class="strike"></i></span></div>
      <div class="rc-row generic"><span class="rc-name"><b class="gn"></b><small class="gt"></small></span>
        <span class="rc-amt gp"></span></div>
      <div class="rc-rule"></div>
      <div class="rc-row total"><span class="sl"></span><span class="rc-amt sv"></span></div>
      <div class="rc-barcode"></div>
      <div class="stamp"><b class="sp"></b><small class="st"></small></div>
    </div></div>
`;
}
function countRupees(el, target, ms = 700) {
  const t0 = performance.now();
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / ms), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = rupees(target * eased);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function printReceipt() {
  const box = document.querySelector("[data-receipt]");
  if (!box || !matchMedia("(min-width: 1200px)").matches) return;
  if (!box.querySelector(".printer")) buildReceipt(box);
  stopReceipt();
  const ex = EXAMPLES[rcSlide % EXAMPLES.length], T = RC_TEXT[lang || "Hinglish"];
  const q = (sel) => box.querySelector(sel);
  const brandTotal = ex.b * 30, genericTotal = ex.g * 30, saved = brandTotal - genericTotal;
  q(".rc-eyebrow").textContent = T.eyebrow;
  q(".rc-title").textContent = T.title;
  q(".rc-date").textContent = new Date().toLocaleDateString(T.locale, { day: "numeric", month: "short", year: "numeric" });
  q(".bn").textContent = ex.brand; q(".bt").textContent = T.brand; q(".bp").textContent = rupees(brandTotal);
  q(".gn").textContent = ex.generic; q(".gt").textContent = T.generic; q(".gp").textContent = rupees(genericTotal);
  q(".sl").textContent = T.save;
  q(".sp").textContent = ex.s + "%"; q(".st").textContent = T.stamp;
  const paper = q(".paper-wrap"), printer = q(".printer");

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {      // no motion: show the finished bill
    paper.className = "paper-wrap static struck";
    q(".sv").textContent = rupees(saved);
    return;
  }
  const later = (fn, ms) => rcTimers.push(setTimeout(fn, ms));
  paper.className = "paper-wrap"; q(".sv").textContent = rupees(0);
  void paper.offsetWidth;                                           // restart the CSS animations
  paper.classList.add("printing"); printer.classList.add("busy");
  later(() => { printer.classList.remove("busy"); paper.classList.add("struck"); }, 2300);
  later(() => countRupees(q(".sv"), saved), 2650);
  later(() => paper.classList.add("stamped"), 3450);
  later(() => paper.classList.add("torn"), RC_CYCLE - 750);
  later(() => { rcSlide++; printReceipt(); }, RC_CYCLE);
}
